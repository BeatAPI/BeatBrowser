<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" fill="none">
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#8992a7" stroke-opacity=".1"/></pattern><linearGradient id="fade" x2="0" y2="1"><stop stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient><mask id="mask"><rect width="100%" height="100%" fill="url(#fade)"/></mask></defs>
<g mask="url(#mask)"><rect width="100%" height="100%" fill="url(#grid)"/></g>
<g transform="translate(175 63) rotate(9)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8a91a5">
<text x="0" y="0" xml:space="preserve" fill="#637bce">{</text>
<text x="0" y="23" xml:space="preserve">  "workspace": "BeatBrowser",</text>
<text x="0" y="46" xml:space="preserve">  "mode": "background"</text>
<text x="0" y="69" xml:space="preserve">}</text>
</g>
<g transform="translate(-28 265) rotate(-8)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8a91a5">
<text x="0" y="0" xml:space="preserve" fill="#637bce">const browser = createBrowser();</text>
<text x="0" y="23" xml:space="preserve">await browser.profiles();</text>
<text x="0" y="46" xml:space="preserve">// your Chrome, your agent</text>
</g>
<g transform="translate(160 475) rotate(8)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8a91a5">
<text x="0" y="0" xml:space="preserve" fill="#637bce">{</text>
<text x="0" y="23" xml:space="preserve">  "pages": [],</text>
<text x="0" y="46" xml:space="preserve">  "session": "local"</text>
<text x="0" y="69" xml:space="preserve">}</text>
</g>
<g transform="translate(-12 650) rotate(-6)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8a91a5">
<text x="0" y="0" xml:space="preserve" fill="#637bce">observe → act → review</text>
<text x="0" y="23" xml:space="preserve">// keep the human in control</text>
</g>
</svg>
