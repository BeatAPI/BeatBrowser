<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">从首次安装，到日常交给 Agent 使用</title><desc id="desc">首次完成配置，之后直接告诉 Agent 你要做什么。 自动处理：doctor 检查或浏览器工具连接时，按需启动本地桥接。</desc><rect width="1280" height="650" rx="24" fill="#f7f9fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="36" fill="#263247" font-weight="700">从首次安装，到日常交给 Agent 使用</text><text x="48" y="100" font-size="21" fill="#526176" font-weight="400">首次完成配置，之后直接告诉 Agent 你要做什么。</text><text x="48" y="151" font-size="19" fill="#2463eb" font-weight="700">首次配置</text><text x="48" y="181" font-size="18" fill="#66758c" font-weight="400">前提：Node.js 20+、Chrome 116+ 与兼容的 MCP 客户端。</text><rect x="48" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="79" cy="239" r="15" fill="#eaf1ff"/><text x="74" y="245" font-size="17" fill="#2463eb" font-weight="700">1</text><text x="105" y="246" font-size="24" fill="#263247" font-weight="700">安装本地工具</text><text x="70" y="283" font-size="18" fill="#526176" font-weight="400">配置 Agent 的 MCP 连接</text><path d="M410 257h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="465" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="496" cy="239" r="15" fill="#eaf1ff"/><text x="491" y="245" font-size="17" fill="#2463eb" font-weight="700">2</text><text x="522" y="246" font-size="24" fill="#263247" font-weight="700">加载 Chrome 扩展</text><text x="487" y="283" font-size="18" fill="#526176" font-weight="400">选择你要使用的浏览器配置</text><path d="M827 257h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="882" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="913" cy="239" r="15" fill="#eaf1ff"/><text x="908" y="245" font-size="17" fill="#2463eb" font-weight="700">3</text><text x="939" y="246" font-size="24" fill="#263247" font-weight="700">确认连接就绪</text><text x="904" y="283" font-size="18" fill="#526176" font-weight="400">重启 Agent，再运行 doctor</text><rect x="48" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="79" cy="470" r="15" fill="#eaf1ff"/><text x="74" y="476" font-size="17" fill="#2463eb" font-weight="700">1</text><text x="105" y="477" font-size="24" fill="#263247" font-weight="700">告诉 Agent 要做什么</text><text x="70" y="514" font-size="18" fill="#526176" font-weight="400">在 Claude Code、Codex 等发任务</text><path d="M410 488h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="465" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="496" cy="470" r="15" fill="#eaf1ff"/><text x="491" y="476" font-size="17" fill="#2463eb" font-weight="700">2</text><text x="522" y="477" font-size="24" fill="#263247" font-weight="700">查看任务进度</text><text x="487" y="514" font-size="18" fill="#526176" font-weight="400">打开扩展里的「工作区」</text><path d="M827 488h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="882" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="913" cy="470" r="15" fill="#eaf1ff"/><text x="908" y="476" font-size="17" fill="#2463eb" font-weight="700">3</text><text x="939" y="477" font-size="24" fill="#263247" font-weight="700">检查结果或人工接管</text><text x="904" y="514" font-size="18" fill="#526176" font-weight="400">按需继续、接管或停止</text><rect x="48" y="327" width="1184" height="43" rx="10" fill="#eaf1ff"/><text x="66" y="355" font-size="19" fill="#1748b0" font-weight="400">自动处理：doctor 检查或浏览器工具连接时，按需启动本地桥接。</text><text x="48" y="408" font-size="19" fill="#2463eb" font-weight="700">日常使用</text><text x="260" y="408" font-size="18" fill="#66758c" font-weight="400">保持 Chrome 打开，扩展已加载。</text><text x="48" y="584" font-size="20" fill="#526176" font-weight="400">Agent 负责执行，你可以查看任务、接管操作，再明确交回控制权。</text><text x="48" y="623" font-size="16" fill="#66758c" font-weight="400">用户路径示意 · 按 2026-10-18 安装文档与执行源码核对</text></g></svg>
