<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">BeatBrowser</title>
  <desc id="desc">Architecture illustration: Agent connects through a local bridge to the Chrome extension. Your Chrome. Your agent. Your control.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#526176" stroke-opacity=".12"/></pattern>
    <linearGradient id="connector"><stop stop-color="#2463eb"/><stop offset="1" stop-color="#526176"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .small { font-size: 18px; font-weight: 700; } .tiny { font-size: 14px; font-weight: 600; } .symbol { font-size: 24px; font-weight: 800; }
  </style>
  <rect width="1200" height="400" rx="24" fill="#f7f9fc"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)" opacity=".08"/>
  <text x="72" y="72" fill="#2463eb" class="mono small" letter-spacing="2">CHROME EXTENSION + LOCAL BRIDGE</text>
  <text x="72" y="190" fill="#263247" class="sans" font-size="76" font-weight="800" letter-spacing="-2">BeatBrowser</text>
  <text x="76" y="242" fill="#526176" class="sans" font-size="22" font-weight="600">Your Chrome. Your agent. Your control.</text>

  <g transform="translate(746 92)">
  <rect x="0" y="58" width="132" height="112" rx="28" fill="#2463eb" fill-opacity=".16" stroke="#2463eb" stroke-width="3"/>
  <rect x="248" y="58" width="132" height="112" rx="28" fill="#526176" fill-opacity=".16" stroke="#526176" stroke-width="3"/>
  <path d="M132 114C170 72 204 156 248 114" fill="none" stroke="url(#connector)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="190" cy="114" r="12" fill="#263247"/>
  <text x="66" y="126" text-anchor="middle" fill="#2463eb" class="sans symbol">Agent</text>
  <text x="314" y="126" text-anchor="middle" fill="#526176" class="sans symbol">Chrome</text>
<text x="190" y="222" text-anchor="middle" fill="#526176" class="sans" font-size="18">Local bridge</text></g>
</svg>
