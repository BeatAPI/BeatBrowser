<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">From setup to your first task</title><desc id="desc">Set up once. Then tell your agent what you need. Automatic: doctor or a browser-tool connection starts the local bridge when needed.</desc><rect width="1280" height="650" rx="24" fill="#f7f9fc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="36" fill="#263247" font-weight="700">From setup to your first task</text><text x="48" y="100" font-size="21" fill="#526176" font-weight="400">Set up once. Then tell your agent what you need.</text><text x="48" y="151" font-size="19" fill="#2463eb" font-weight="700">FIRST-TIME SETUP</text><text x="48" y="181" font-size="18" fill="#66758c" font-weight="400">Requires Node.js 20+, Chrome 116+ and a compatible MCP client.</text><rect x="48" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="79" cy="239" r="15" fill="#eaf1ff"/><text x="74" y="245" font-size="17" fill="#2463eb" font-weight="700">1</text><text x="105" y="246" font-size="24" fill="#263247" font-weight="700">Install local tools</text><text x="70" y="283" font-size="18" fill="#526176" font-weight="400">Configure your agent</text><path d="M410 257h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="465" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="496" cy="239" r="15" fill="#eaf1ff"/><text x="491" y="245" font-size="17" fill="#2463eb" font-weight="700">2</text><text x="522" y="246" font-size="24" fill="#263247" font-weight="700">Load Chrome extension</text><text x="487" y="283" font-size="18" fill="#526176" font-weight="400">Use your intended Chrome profile</text><path d="M827 257h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="882" y="205" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="913" cy="239" r="15" fill="#eaf1ff"/><text x="908" y="245" font-size="17" fill="#2463eb" font-weight="700">3</text><text x="939" y="246" font-size="24" fill="#263247" font-weight="700">Check the connection</text><text x="904" y="283" font-size="18" fill="#526176" font-weight="400">Restart agent and run doctor</text><rect x="48" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="79" cy="470" r="15" fill="#eaf1ff"/><text x="74" y="476" font-size="17" fill="#2463eb" font-weight="700">1</text><text x="105" y="477" font-size="24" fill="#263247" font-weight="700">Describe your task</text><text x="70" y="514" font-size="18" fill="#526176" font-weight="400">In Claude Code, Codex or Cursor</text><path d="M410 488h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="465" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="496" cy="470" r="15" fill="#eaf1ff"/><text x="491" y="476" font-size="17" fill="#2463eb" font-weight="700">2</text><text x="522" y="477" font-size="24" fill="#263247" font-weight="700">Follow its progress</text><text x="487" y="514" font-size="18" fill="#526176" font-weight="400">Open the extension Workspace</text><path d="M827 488h41m-9-7 9 7-9 7" fill="none" stroke="#8194b3" stroke-width="2.5" stroke-linejoin="round"/><rect x="882" y="436" width="350" height="104" rx="14" fill="white" stroke="#dce3ed"/><circle cx="913" cy="470" r="15" fill="#eaf1ff"/><text x="908" y="476" font-size="17" fill="#2463eb" font-weight="700">3</text><text x="939" y="477" font-size="24" fill="#263247" font-weight="700">Review or take over</text><text x="904" y="514" font-size="18" fill="#526176" font-weight="400">Continue, take control or stop</text><rect x="48" y="327" width="1184" height="43" rx="10" fill="#eaf1ff"/><text x="66" y="355" font-size="19" fill="#1748b0" font-weight="400">Automatic: doctor or a browser-tool connection starts the local bridge when needed.</text><text x="48" y="408" font-size="19" fill="#2463eb" font-weight="700">EVERYDAY USE</text><text x="260" y="408" font-size="18" fill="#66758c" font-weight="400">Keep Chrome open with the extension loaded.</text><text x="48" y="584" font-size="20" fill="#526176" font-weight="400">The agent runs the task; you can inspect it and return control when ready.</text><text x="48" y="623" font-size="16" fill="#66758c" font-weight="400">User journey illustration · setup and runtime code reviewed 2026-10-18</text></g></svg>
