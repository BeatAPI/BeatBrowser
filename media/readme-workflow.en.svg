<!-- [INPUT] README flowchart labels and connections. [OUTPUT] Static, accessible README diagram. [POS] Repository documentation asset. [PROTOCOL] Preserve all flow branches; no scripts or interactive viewer. -->
<title id="title">From installation to a finished task</title>
<desc id="desc">flowchart LR
    A[Install CLI and extension] --&gt; B[Connect your Agent]
    B --&gt; C[Choose a signed-in Chrome profile]
    C --&gt; D[Start a background task]
    D --&gt; E[Review progress in the sidebar]
    E --&gt; F{Your decision}
    F --&gt;|Continue| D
    F --&gt;|Take over| G[Manual control]
    G --&gt;|Return control| D
    F --&gt;|Finish| H[Close task pages and clear the record]
</desc>
